[project]
name = "agentz"
version = "0.1.0"
description = "demo"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "griffelib==2.0.0",
    "httpx[socks]>=0.28.1",
    "pydantic-ai[duckduckgo,tavily]==2.14.1",
    "pydantic-ai-harness==0.9.0",
    "pydantic-ai-skills==1.1.0",
    "prompt-toolkit>=3.0.52",
    "python-dotenv>=1.1.1",
    "rich>=13.0.0",
    "starlette>=0.40",
    "uvicorn>=0.30",
    "markdown-it-py>=3.0.0",
]

[tool.logfire]
service_name="mcp-server"
console = false
send_to_logfire = true

[dependency-groups]
dev = [
    "pydantic-evals==2.14.1",
    "pyinstaller>=6.21.0",
]
